name: Release

on:
  push:
    tags:
      - "v*"          # 推送 v0.1.0、v1.2.3 等 tag 时触发

permissions:
  contents: write      # 需要写权限来创建 Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  # ========== Windows 便携包 ==========
  build-windows:
    name: Build Windows Portable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        run: flutter build windows --release

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Package portable zip
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $zipName  = "Achievements-${{ steps.version.outputs.VERSION }}-windows-portable.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipName -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: frontend/Achievements-*-windows-portable.zip
          retention-days: 5

  # ========== Android APK ==========
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run codegen
        run: dart run build_runner build --delete-conflicting-outputs

      # ---- 签名配置(通过 GitHub Secrets 注入)----
      # 如果未配置 Secrets,会使用 debug 签名
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # tr 去掉 CR/换行/空格：防 Windows 端写入的 base64 带 CRLF/尾换行。
        # 注意：UTF-16/BOM 无法在此恢复，须在设置 Secret 时用纯 ASCII（gh secret set --body）。
        run: echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release.keystore

      - name: Create key.properties
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Extract version from tag
        id: version
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "Achievements-${{ steps.version.outputs.VERSION }}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frontend/Achievements-*-android.apk
          retention-days: 5

  # ========== 发布到 GitHub Releases ==========
  publish:
    name: Publish Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lah dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Achievements ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
