name: achievements
description: Achievements - cross-platform Todo app (Windows + Android)
publish_to: none
version: 0.3.2+8
environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ---- 状态管理 ----
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ---- 路由 ----
  go_router: ^14.6.2

  # ---- 数据层(本地)----
  drift: ^2.21.0
  sqlite3: ^2.4.7
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # ---- 数据层(远程)----
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  # retrofit 留到 Phase 2 实装 API 客户端时再装(retrofit/retrofit_generator
  # 的上游版本经常不同步,届时按需锁定到一致的版本对)

  # ---- 模型与序列化 ----
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  collection: ^1.18.0

  # ---- 提醒 / 后台 ----
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1

  # ---- 重复任务规则(RFC5545 RRULE 展开)----
  rrule: ^0.2.16

  # ---- 图表 / 动效 ----
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.2

  # ---- SVG 图标 ----
  flutter_svg: ^2.0.17

  # ---- 桌面端增强(Windows)----
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  hotkey_manager: ^0.2.3

  # ---- 国际化 / 格式化 ----
  intl: 0.20.2
  connectivity_plus: ^7.1.1
  calendar_date_picker2: ^3.0.0

  # ---- 外部链接(浏览器跳转)----
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 静态分析(替换默认 flutter_lints)
  very_good_analysis: ^6.0.0

  # 代码生成
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.21.2
  # retrofit_generator 与 retrofit 同步引入(见 dependencies 注释)
  riverpod_generator: ^2.6.3

  # custom_lint + riverpod_lint 暂不引入:它们间接拉入的 custom_lint_visitor /
  # analyzer_plugin 与 build_runner 当前发布的 analyzer 版本(2026-05)有交叉
  # 不兼容,会导致 build_runner 启动失败。Phase 4 静态分析强化时再补回。

  # ---- 图标生成 ----
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.ico
    - assets/app_icon.png
    - assets/icons/
    - assets/achievements_svg/
    - assets/logos/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 23
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48

dependency_overrides:
  calendar_date_picker2:
    path: packages/calendar_date_picker2
