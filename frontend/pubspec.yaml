name: achievements
description: Achievements - cross-platform Todo app (Windows + Android)
publish_to: none
version: 0.0.1+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ---- 状态管理 ----
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ---- 路由 ----
  go_router: ^14.6.2

  # ---- 数据层(本地)----
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # ---- 数据层(远程)----
  dio: ^5.7.0
  retrofit: ^4.4.1

  # ---- 模型与序列化 ----
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  collection: ^1.18.0

  # ---- 提醒 / 后台 ----
  flutter_local_notifications: ^17.2.4
  workmanager: ^0.5.2

  # ---- 图表 / 动效 ----
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.2

  # ---- 桌面端增强(Windows)----
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  hotkey_manager: ^0.2.3

  # ---- 国际化 / 格式化 ----
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 静态分析(替换默认 flutter_lints)
  very_good_analysis: ^6.0.0

  # 代码生成
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.21.2
  retrofit_generator: ^9.1.5
  riverpod_generator: ^2.6.3

  # Riverpod 专用 lint(配合 custom_lint)
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
