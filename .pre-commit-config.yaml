## pre-commit 钩子配置
## 安装: uv tool install pre-commit && pre-commit install
## 手动跑全量: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  ## 后端 Python:ruff (lint + format) + mypy
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^backend/app/
        additional_dependencies:
          - "pydantic>=2.7"
          - "pydantic-settings>=2.3"
          - "sqlalchemy>=2.0"
          - "fastapi>=0.115"
        args: ["--config-file=backend/pyproject.toml"]

  ## 前端 Dart / Flutter
  ## flutter analyze 必须在含有 pubspec.yaml 的目录运行,所以用 local hook 走自定义命令
  - repo: local
    hooks:
      - id: dart-format
        name: dart format (frontend)
        entry: bash -c 'cd frontend && dart format --set-exit-if-changed .'
        language: system
        files: ^frontend/.*\.dart$
        pass_filenames: false
      - id: flutter-analyze
        name: flutter analyze (frontend)
        entry: bash -c 'cd frontend && flutter analyze --no-fatal-infos'
        language: system
        files: ^frontend/.*\.dart$
        pass_filenames: false
