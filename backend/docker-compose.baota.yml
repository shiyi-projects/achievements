# 宝塔 VPS 单容器部署 compose。
#
# 用法(推荐一键脚本,自动构建 + 迁移 + 启动 + 健康检查):
#   1. cd /www/wwwroot/achievements-backend
#   2. cp .env.prod.example .env.prod,填入 Supabase DATABASE_URL 等真实值
#   3. bash start-baota.sh
#   手动方式: docker compose -f docker-compose.baota.yml up -d --build(需另跑 alembic 迁移)
#
# 与原 docker-compose.prod.yml 的区别:
# - 不跑 db / redis 容器(DB 走 Supabase;Redis 代码暂未用,后续再加)
# - 不依赖 docker-compose.yml,**单文件可独立运行**
# - 端口 8084 只绑回环,给宝塔 nginx 反代

name: achievements-prod

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        USE_CN_MIRROR: "true"
        PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple/"
    image: achievements/backend:latest
    container_name: achievements-api
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    # 命令 / 暴露端口 / 健康检查均沿用 Dockerfile 默认(uvicorn 监听 8084)
    ports:
      - "127.0.0.1:8084:8084"  # 宿主 127.0.0.1:8084 → 容器 8084;nginx 反代到这里
    volumes:
      - /www/wwwroot/achievements-storage/attachments:/app/storage/attachments
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
